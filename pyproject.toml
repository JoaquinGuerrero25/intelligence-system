[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "intelligence-system"
version = "1.0.0"
description = "Sistema de IA de producción: RAG híbrido + agentes con Supervisor (LangGraph) + API FastAPI + trazas en Phoenix"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Orquestación y LLMs
    "langgraph>=1.0",
    "langchain-core>=1.0",
    "langchain-openai>=1.0",
    "langchain-google-genai>=4.0",
    "langgraph-checkpoint-redis>=0.1",
    # API, validación y configuración
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "httpx>=0.27",
    "redis>=5.2",
    # RAG
    "rank-bm25>=0.2.2",
    "pinecone[asyncio]>=7.0",
    # Observabilidad (Arize Phoenix vía OpenInference)
    "arize-phoenix-otel>=0.9",
    "openinference-instrumentation-langchain>=0.1.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "fakeredis>=2.26",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["intelligence*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
